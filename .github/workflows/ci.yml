name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Produce exact ISBN scanner formatting
        run: |
          npx prettier --write isbn-scanner.js
          echo "FORMATTED_ISBN_SCANNER_BEGIN"
          base64 -w0 isbn-scanner.js
          echo
          echo "FORMATTED_ISBN_SCANNER_END"
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build