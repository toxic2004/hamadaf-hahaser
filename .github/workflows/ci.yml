name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iphone-isbn-camera-fallback
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format and commit iPhone ISBN scanner
        run: |
          npx prettier --write isbn-scanner.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isbn-scanner.js
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "style: apply exact Prettier formatting"
            git push origin HEAD:fix/iphone-isbn-camera-fallback
          fi
