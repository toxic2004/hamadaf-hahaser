name: Temporary EAN asset patch

on:
  push:
    branches: [feature/ean13-israeli-books]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ean13-israeli-books
      - name: Add EAN scanner script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('isbn.html')
          source = path.read_text(encoding='utf-8')
          old = '    <script src="isbn-scanner.js"></script>'
          new = '    <script src="barcode-ean.js?v=ean-israeli-books-20260729-1"></script>\n    <script src="isbn-scanner.js"></script>'
          if 'barcode-ean.js' not in source:
              if old not in source:
                  raise SystemExit('Expected isbn-scanner script tag was not found')
              path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isbn.html
          if git diff --cached --quiet; then
            echo "No patch needed"
          else
            git commit -m "feat: load EAN barcode scanner"
            git push origin HEAD:feature/ean13-israeli-books
          fi
