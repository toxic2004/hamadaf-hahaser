name: Temporary loader version fix

on:
  push:
    branches: [ci/verify-fix-16]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('safe-app-loader.js')
          source = path.read_text(encoding='utf-8')
          old = './manual-import.js?v=manual-confirmation-20260729-1'
          new = './manual-import.js?v=local-import-signature-20260729-1'
          if old not in source:
              raise SystemExit('Expected loader version was not found')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Commit loader version fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add safe-app-loader.js
          git commit -m "fix: load signed manual import version"
          git push
