name: Format approved files

on:
  push:
    branches:
      - fix/prettier-approved

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format approved files only
        run: npx prettier --write cover-storage.js migrate-one-cover.js notifications.html notifications.js safe-app-loader.js supabase-client.js
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cover-storage.js migrate-one-cover.js notifications.html notifications.js safe-app-loader.js supabase-client.js
          git commit -m "style: format approved files"
          git push
