name: Validate alerts without repository secrets

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN to validate the alerts implementation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: validate-alerts-no-secrets
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm intentional validation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "RUN"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate alerts code and Supabase scheduling configuration
        run: npm test

      - name: Explain live delivery source
        run: |
          echo "Live alert delivery is scheduled inside Supabase using pg_cron and a Vault secret."
          echo "No GitHub repository secret is required for this validation workflow."
