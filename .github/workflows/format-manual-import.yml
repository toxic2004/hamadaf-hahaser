name: Format manual import

on:
  push:
    branches:
      - fix/1-manual-import-confirmation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1-manual-import-confirmation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write manual-import.js
      - name: Commit formatted file
        run: |
          if git diff --quiet -- manual-import.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual-import.js
          git commit -m "style: format manual import with Prettier"
          git push origin HEAD:fix/1-manual-import-confirmation
